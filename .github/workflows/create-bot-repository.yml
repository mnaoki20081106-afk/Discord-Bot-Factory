name: Create Bot Repository

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: "New GitHub repository name"
        required: true
        type: string
      runtime:
        description: "Starter type"
        required: true
        default: "node"
        type: choice
        options:
          - node
          - worker
      visibility:
        description: "Repository visibility"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - public
      description:
        description: "Repository description"
        required: false
        default: "Discord bot created by Discord-Bot-Factory"
        type: string
      confirm:
        description: "Type CREATE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create:
    if: ${{ inputs.confirm == 'CREATE' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Require repository-management token
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::FACTORY_GITHUB_PAT is not configured."
            exit 1
          fi

      - name: Create repository
        id: create
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_PAT }}
        run: |
          scripts/create-repository.sh             "${{ inputs.repository_name }}"             "${{ inputs.visibility }}"             "${{ inputs.description }}"

      - name: Scaffold repository
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_PAT }}
          FACTORY_ROOT: ${{ github.workspace }}
        run: |
          scripts/scaffold-repository.sh             "${{ steps.create.outputs.repository }}"             "${{ inputs.runtime }}"             "${{ inputs.repository_name }}"

      - name: Summary
        run: |
          {
            echo "### Bot created"
            echo "- Repository: `${{ steps.create.outputs.repository }}`"
            echo "- Starter: `${{ inputs.runtime }}`"
            echo ""
            echo "Factory work is complete. Deployment and operation are intentionally separate."
          } >> "$GITHUB_STEP_SUMMARY"

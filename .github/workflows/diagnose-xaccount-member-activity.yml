name: Diagnose Xaccount member activity

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-xaccount-member-activity.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CONTROL_CF_TOKEN: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_API_TOKEN }}
      CONTROL_CF_ACCOUNT_ID: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_MASTER_KEY: ${{ secrets.CONTROL_PLANE_MASTER_KEY }}
      XACCOUNT_CF_ACCOUNT_ID: "3f4daf94bed8e8159413918292375b7a"
      XACCOUNT_D1_ID: "284a6d6b-0dc5-479f-ba0e-86eb445df2cd"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read live Worker health
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 1 \
            https://xaccount-bot.mnaoki20081106.workers.dev/health
          echo

      - name: Read production member activity state safely
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { webcrypto } = require("node:crypto");
          const crypto = webcrypto;

          const cpToken = process.env.CONTROL_CF_TOKEN;
          const cpAccount = process.env.CONTROL_CF_ACCOUNT_ID;
          const masterB64 = process.env.CONTROL_MASTER_KEY;
          const targetAccount = process.env.XACCOUNT_CF_ACCOUNT_ID;
          const targetDb = process.env.XACCOUNT_D1_ID;

          for (const [name, value] of Object.entries({
            CONTROL_CF_TOKEN: cpToken,
            CONTROL_CF_ACCOUNT_ID: cpAccount,
            CONTROL_MASTER_KEY: masterB64,
            XACCOUNT_CF_ACCOUNT_ID: targetAccount,
            XACCOUNT_D1_ID: targetDb,
          })) {
            if (!value) throw new Error(name + " is missing");
          }

          const headers = token => ({
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          });

          async function cf(token, url, init = {}) {
            const response = await fetch("https://api.cloudflare.com/client/v4" + url, {
              ...init,
              headers: { ...headers(token), ...(init.headers || {}) },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              throw new Error(
                "Cloudflare API " + response.status + " " +
                JSON.stringify(body.errors || body).slice(0, 600)
              );
            }
            return body.result;
          }

          async function query(token, account, db, sql, params = []) {
            const result = await cf(
              token,
              "/accounts/" + account + "/d1/database/" + db + "/query",
              {
                method: "POST",
                body: JSON.stringify({ sql, params }),
              }
            );
            const first = Array.isArray(result) ? result[0] : result;
            return Array.isArray(first?.results) ? first.results : [];
          }

          function fromB64(value) {
            return Uint8Array.from(Buffer.from(String(value), "base64"));
          }

          async function decrypt(packed) {
            const parsed = JSON.parse(packed);
            if (parsed.v !== 1) throw new Error("Unsupported token encryption format");
            const rawKey = Buffer.from(String(masterB64).replace(/\s+/g, ""), "base64");
            if (rawKey.length !== 32) throw new Error("Master key length mismatch");
            const key = await crypto.subtle.importKey(
              "raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]
            );
            const clear = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: fromB64(parsed.iv) },
              key,
              fromB64(parsed.ct)
            );
            return Buffer.from(clear).toString("utf8");
          }

          const dbs = await cf(cpToken, "/accounts/" + cpAccount + "/d1/database?per_page=100");
          let encryptedToken = null;
          for (const db of dbs || []) {
            try {
              const tables = await query(
                cpToken,
                cpAccount,
                db.uuid,
                "SELECT name FROM sqlite_master WHERE type='table' AND name='cloudflare_accounts'"
              );
              if (!tables.length) continue;
              const rows = await query(
                cpToken,
                cpAccount,
                db.uuid,
                "SELECT encrypted_token FROM cloudflare_accounts WHERE account_id=? LIMIT 1",
                [targetAccount]
              );
              if (rows[0]?.encrypted_token) {
                encryptedToken = rows[0].encrypted_token;
                break;
              }
            } catch {
              // Not the Control Plane database.
            }
          }

          if (!encryptedToken) {
            throw new Error("Xaccount Cloudflare credential was not found in Control Plane D1");
          }

          const targetToken = await decrypt(encryptedToken);
          process.stdout.write("::add-mask::" + targetToken + "\n");

          const settings = await query(
            targetToken,
            targetAccount,
            targetDb,
            `SELECT guild_id, enabled, channel_id, join_enabled, leave_enabled,
                    initialized, last_scan_at, last_member_count, last_error, updated_at
               FROM member_activity_settings
              ORDER BY updated_at DESC
              LIMIT 25`
          );

          const snapshots = await query(
            targetToken,
            targetAccount,
            targetDb,
            `SELECT guild_id, COUNT(*) AS snapshot_members,
                    MAX(last_seen_at) AS newest_seen_at
               FROM member_activity_members
              GROUP BY guild_id`
          );

          const snapshotByGuild = new Map(
            snapshots.map(row => [String(row.guild_id), row])
          );

          const safe = settings.map((row, index) => {
            const snap = snapshotByGuild.get(String(row.guild_id));
            return {
              guild: "guild#" + (index + 1),
              enabled: Number(row.enabled) === 1,
              channelConfigured: Boolean(row.channel_id),
              joinEnabled: Number(row.join_enabled) === 1,
              leaveEnabled: Number(row.leave_enabled) === 1,
              initialized: Number(row.initialized) === 1,
              lastScanAt: row.last_scan_at ? new Date(Number(row.last_scan_at)).toISOString() : null,
              memberCount: Number(row.last_member_count || 0),
              lastError: row.last_error || null,
              updatedAt: row.updated_at ? new Date(Number(row.updated_at)).toISOString() : null,
              snapshotMembers: Number(snap?.snapshot_members || 0),
              newestSnapshotAt: snap?.newest_seen_at
                ? new Date(Number(snap.newest_seen_at)).toISOString()
                : null,
            };
          });

          console.log("MEMBER_ACTIVITY_DIAGNOSTIC=" + JSON.stringify(safe));
          NODE

name: Deploy Bot

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Control Plane deployment job ID"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bot-factory-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claim deployment job
        id: claim
        env:
          FACTORY_CONTROL_PLANE_URL: ${{ vars.FACTORY_CONTROL_PLANE_URL }}
          FACTORY_CONTROL_PLANE_KEY: ${{ secrets.FACTORY_CONTROL_PLANE_KEY }}
        run: |
          set -euo pipefail
          : "${FACTORY_CONTROL_PLANE_URL:?FACTORY_CONTROL_PLANE_URL is not configured}"
          : "${FACTORY_CONTROL_PLANE_KEY:?FACTORY_CONTROL_PLANE_KEY is not configured}"

          job_file="$RUNNER_TEMP/factory-job.json"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          control_plane_url="${FACTORY_CONTROL_PLANE_URL%/}"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $FACTORY_CONTROL_PLANE_KEY" \
            -H "X-Factory-Run-ID: $GITHUB_RUN_ID" \
            -H "X-Factory-Run-URL: $run_url" \
            "$control_plane_url/api/internal/jobs/${{ inputs.job_id }}/claim" \
            > "$job_file"

          node scripts/claim-job.mjs "$job_file"
          rm -f "$job_file"

      - name: Checkout bot repository
        env:
          SOURCE_REPOSITORY: ${{ steps.claim.outputs.repository }}
          SOURCE_REF: ${{ steps.claim.outputs.ref }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$FACTORY_GITHUB_PAT"
          : "${GH_TOKEN:?Factory GitHub PAT was not loaded}"
          gh repo clone "$SOURCE_REPOSITORY" source -- --branch "$SOURCE_REF" --depth 1

      - name: Read deployment manifest
        id: manifest
        run: |
          node scripts/read-manifest.mjs             "$GITHUB_WORKSPACE/source"             "${{ steps.claim.outputs.repository }}" >> "$GITHUB_OUTPUT"

      - name: Deploy and provision Cloudflare resources
        env:
          FACTORY_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/cloudflare/deploy.sh \
            "$GITHUB_WORKSPACE/source" \
            "${{ steps.manifest.outputs.working_directory }}" \
            "${{ steps.manifest.outputs.name }}" \
            "${{ steps.manifest.outputs.wrangler_config }}" \
            "${{ steps.manifest.outputs.health_url }}" \
            '${{ steps.manifest.outputs.d1_migrations }}' \
            '${{ steps.manifest.outputs.d1_schema_files }}'

      - name: Persist auto-provisioned Wrangler IDs
        working-directory: source
        env:
          SOURCE_REF: ${{ steps.claim.outputs.ref }}
          WORKING_DIRECTORY: ${{ steps.manifest.outputs.working_directory }}
          WRANGLER_CONFIG: ${{ steps.manifest.outputs.wrangler_config }}
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN="$FACTORY_GITHUB_PAT"
          : "${GH_TOKEN:?Factory GitHub PAT was not loaded}"

          if [[ "$WORKING_DIRECTORY" == "." ]]; then
            config_path="$WRANGLER_CONFIG"
          else
            config_path="${WORKING_DIRECTORY%/}/$WRANGLER_CONFIG"
          fi

          if [[ -z "$(git status --porcelain -- "$config_path")" ]]; then
            echo "No Wrangler resource IDs changed."
            exit 0
          fi

          gh auth setup-git
          git config user.name "discord-bot-factory[bot]"
          git config user.email "discord-bot-factory[bot]@users.noreply.github.com"
          git add -- "$config_path"
          git commit -m "chore: persist Cloudflare resource bindings"
          git fetch origin "$SOURCE_REF"
          git rebase "origin/$SOURCE_REF"
          git push origin "HEAD:$SOURCE_REF"

      - name: Deployment summary
        run: |
          {
            echo "### Cloudflare deployment complete"
            echo "- Worker: `${{ steps.manifest.outputs.name }}`"
            echo "- Account ID: `${{ steps.claim.outputs.cloudflare_account_id }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report result to Control Plane
        if: ${{ always() }}
        env:
          FACTORY_CONTROL_PLANE_URL: ${{ vars.FACTORY_CONTROL_PLANE_URL }}
          FACTORY_CONTROL_PLANE_KEY: ${{ secrets.FACTORY_CONTROL_PLANE_KEY }}
          CONCLUSION: ${{ job.status }}
        run: |
          set +e
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          control_plane_url="${FACTORY_CONTROL_PLANE_URL%/}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({conclusion:process.env.CONCLUSION,workflow_run_id:process.env.GITHUB_RUN_ID,workflow_run_url:process.argv[1]}))' "$run_url")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $FACTORY_CONTROL_PLANE_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$control_plane_url/api/internal/jobs/${{ inputs.job_id }}/result" \
            >/dev/null

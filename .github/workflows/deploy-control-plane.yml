name: Deploy Control Plane

on:
  push:
    branches: ["main"]
    paths: [".factory/deploy-now"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_CONTROL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: factory-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'DEPLOY_CONTROL' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_ACCOUNT_ID }}
      FACTORY_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
      FACTORY_MASTER_KEY: ${{ secrets.CONTROL_PLANE_MASTER_KEY }}
      FACTORY_SESSION_SECRET: ${{ secrets.CONTROL_PLANE_SESSION_SECRET }}
      FACTORY_CONTROL_PLANE_KEY: ${{ secrets.FACTORY_CONTROL_PLANE_KEY }}
      FACTORY_CONTROL_PLANE_URL: ${{ vars.FACTORY_CONTROL_PLANE_URL }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate bootstrap secrets
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CONTROL_PLANE_CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CONTROL_PLANE_CLOUDFLARE_ACCOUNT_ID is required}"
          : "${FACTORY_ADMIN_PASSWORD:?CONTROL_PLANE_ADMIN_PASSWORD is required}"
          : "${FACTORY_MASTER_KEY:?CONTROL_PLANE_MASTER_KEY is required}"
          : "${FACTORY_SESSION_SECRET:?CONTROL_PLANE_SESSION_SECRET is required}"
          : "${FACTORY_CONTROL_PLANE_KEY:?FACTORY_CONTROL_PLANE_KEY is required}"

          node <<'NODE'
          const master = String(process.env.FACTORY_MASTER_KEY || "").replace(/\s+/g, "");
          let decoded;
          try {
            decoded = Buffer.from(master, "base64");
          } catch {
            process.exitCode = 1;
            throw new Error("CONTROL_PLANE_MASTER_KEY must be valid base64.");
          }
          if (decoded.length !== 32) {
            throw new Error("CONTROL_PLANE_MASTER_KEY must decode to exactly 32 bytes.");
          }
          if (String(process.env.FACTORY_SESSION_SECRET || "").length < 32) {
            throw new Error("CONTROL_PLANE_SESSION_SECRET must be at least 32 characters.");
          }
          if (String(process.env.FACTORY_CONTROL_PLANE_KEY || "").length < 32) {
            throw new Error("FACTORY_CONTROL_PLANE_KEY must be at least 32 characters.");
          }
          NODE

      - name: Install dependencies
        working-directory: apps/control-plane
        run: npm install

      - name: Build Control Plane secrets file
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/control-plane-secrets.json"

          node - "$secret_file" <<'NODE'
          const fs = require("node:fs");
          const output = process.argv[2];
          const values = {
            FACTORY_ADMIN_PASSWORD: process.env.FACTORY_ADMIN_PASSWORD,
            FACTORY_MASTER_KEY: process.env.FACTORY_MASTER_KEY,
            FACTORY_SESSION_SECRET: process.env.FACTORY_SESSION_SECRET,
            FACTORY_CONTROL_PLANE_KEY: process.env.FACTORY_CONTROL_PLANE_KEY,
          };
          fs.writeFileSync(output, JSON.stringify(values), { mode: 0o600 });
          NODE

          echo "path=$secret_file" >> "$GITHUB_OUTPUT"

      - name: Deploy Control Plane Worker with secrets
        working-directory: apps/control-plane
        run: npx wrangler deploy --secrets-file "${{ steps.secrets.outputs.path }}"

      - name: Apply D1 schema
        working-directory: apps/control-plane
        run: npx wrangler d1 execute DB --remote --file=./schema.sql

      - name: Persist auto-provisioned Control Plane D1 binding
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- apps/control-plane/wrangler.jsonc; then
            echo "Control Plane Wrangler config did not change."
            exit 0
          fi

          git config user.name "discord-bot-factory[bot]"
          git config user.email "discord-bot-factory[bot]@users.noreply.github.com"
          git add apps/control-plane/wrangler.jsonc
          git commit -m "chore(control-plane): persist D1 binding"
          git push origin HEAD:main

      - name: Remove temporary secrets file
        if: ${{ always() }}
        run: rm -f "${{ steps.secrets.outputs.path }}"

      - name: Verify deployed Control Plane
        if: ${{ env.FACTORY_CONTROL_PLANE_URL != '' }}
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            "${FACTORY_CONTROL_PLANE_URL%/}/" \
            >/dev/null

      - name: Summary
        run: |
          {
            echo "### Control Plane deployed"
            echo ""
            echo "Copy the workers.dev URL from the Wrangler deploy output."
            echo "Then create the GitHub Actions repository variable:"
            echo ""
            echo "- FACTORY_CONTROL_PLANE_URL = https://<your-control-plane>.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"

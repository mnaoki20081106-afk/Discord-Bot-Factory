name: Factory CI

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "apps/control-plane/**"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
  pull_request:
    paths:
      - "scripts/**"
      - "apps/control-plane/**"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check scripts/read-manifest.mjs
          node --check scripts/validate-secret-bundle.mjs
          node --check scripts/claim-job.mjs
          node --check apps/control-plane/src/index.js
          node --check apps/control-plane/public/app.js

      - name: Check shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' file; do
              bash -n "$file"
            done

      - name: Validate Control Plane Worker build
        working-directory: apps/control-plane
        run: |
          set -euo pipefail
          npm install
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/control-plane-dist"

      - name: Test Worker manifest
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          mkdir -p "$tmp/apps/worker"
          cat > "$tmp/bot-factory.json" <<'JSON'
          {
            "name": "Test Worker",
            "provider": "cloudflare",
            "runtime": "worker",
            "working_directory": "apps/worker",
            "wrangler_config": "wrangler.jsonc",
            "d1_migrations": ["DB"],
            "setup": {
              "fields": [
                {
                  "key": "DISCORD_BOT_TOKEN",
                  "label": "BOT Token",
                  "type": "secret",
                  "required": true
                }
              ],
              "discord": {
                "intents": [
                  {
                    "id": "members",
                    "label": "Server Members Intent",
                    "required": true
                  }
                ]
              }
            }
          }
          JSON
          printf '{}\n' > "$tmp/apps/worker/wrangler.jsonc"

          output="$(node scripts/read-manifest.mjs "$tmp" owner/repo)"
          printf '%s\n' "$output" | grep -F 'test-worker'
          printf '%s\n' "$output" | grep -F 'apps/worker'
          printf '%s\n' "$output" | grep -F 'wrangler.jsonc'

      - name: Reject non-Cloudflare manifest
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '{}\n' > "$tmp/wrangler.jsonc"
          printf '{"name":"bad","runtime":"node","provider":"oracle"}\n' > "$tmp/bot-factory.json"

          if node scripts/read-manifest.mjs "$tmp" owner/repo >/tmp/manifest-output.txt 2>&1; then
            echo "::error::Non-Cloudflare manifest was unexpectedly accepted."
            exit 1
          fi

      - name: Validate Control Plane schema
        run: |
          set -euo pipefail
          grep -F 'CREATE TABLE IF NOT EXISTS cloudflare_accounts' apps/control-plane/schema.sql
          grep -F 'CREATE TABLE IF NOT EXISTS deployments' apps/control-plane/schema.sql
          grep -F 'CREATE TABLE IF NOT EXISTS settings' apps/control-plane/schema.sql
          grep -F 'url: String(item.url || "")' apps/control-plane/src/index.js

      - name: Enforce site-managed account routing
        run: |
          set -euo pipefail

          test -f .github/workflows/deploy-bot.yml
          test -f scripts/cloudflare/deploy.sh
          test -f scripts/claim-job.mjs
          test -f apps/control-plane/src/index.js
          test -f apps/control-plane/public/index.html

          test ! -e scripts/oracle
          test ! -e scripts/cloudflare/resolve-account.mjs
          test ! -e .github/workflows/create-bot-repository.yml
          test ! -e scripts/create-repository.sh
          test ! -e scripts/scaffold-repository.sh
          test ! -e templates

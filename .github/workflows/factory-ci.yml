name: Factory CI

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' file; do
              bash -n "$file"
            done

      - name: Validate required templates
        run: |
          set -euo pipefail

          test -f templates/node/package.json
          test -f templates/node/src/index.js
          test -f templates/node/README.md

          test -f templates/worker/package.json
          test -f templates/worker/src/index.js
          test -f templates/worker/wrangler.jsonc
          test -f templates/worker/README.md

      - name: Enforce creation-only scope
        run: |
          set -euo pipefail

          test ! -e .github/workflows/deploy-bot.yml
          test ! -e scripts/cloudflare
          test ! -e scripts/oracle

          test -f scripts/create-repository.sh
          test -f scripts/scaffold-repository.sh

name: Factory CI

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' file; do
              bash -n "$file"
            done

      - name: Validate required templates
        run: |
          set -euo pipefail

          test -f templates/node/package.json
          test -f templates/node/src/index.js
          test -f templates/node/README.md

          test -f templates/worker/package.json
          test -f templates/worker/src/index.js
          test -f templates/worker/wrangler.jsonc
          test -f templates/worker/README.md

      - name: Ensure Factory has no deployment automation
        run: |
          set -euo pipefail

          if find .github/workflows scripts             -type f             -not -path './scripts/create-repository.sh'             -not -path './scripts/scaffold-repository.sh'             -print0 |
            xargs -0 grep -Eli               'wrangler deploy|oci compute|docker run|cloudflare_api_token|oci_tenancy_ocid'               >/tmp/factory-deploy-matches.txt; then
            echo "::error::Creation-only Factory contains deployment/hosting logic:"
            cat /tmp/factory-deploy-matches.txt
            exit 1
          fi

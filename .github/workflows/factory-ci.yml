name: Factory CI

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Check shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' file; do
              bash -n "$file"
            done

      - name: Test Cloudflare manifest
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          mkdir -p "$tmp/apps/worker"
          cat > "$tmp/bot-factory.json" <<'JSON'
          {
            "name": "Test Worker",
            "provider": "cloudflare",
            "runtime": "worker",
            "cloudflare_account": "guild-a",
            "working_directory": "apps/worker",
            "wrangler_config": "wrangler.jsonc",
            "d1_migrations": ["DB"]
          }
          JSON
          printf '{}\n' > "$tmp/apps/worker/wrangler.jsonc"

          output="$(node scripts/read-manifest.mjs "$tmp" owner/repo)"
          printf '%s\n' "$output" | grep -F 'test-worker'
          printf '%s\n' "$output" | grep -F 'guild-a'
          printf '%s\n' "$output" | grep -F 'apps/worker'

      - name: Reject manifest without account assignment
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '{}\n' > "$tmp/wrangler.jsonc"
          printf '{"name":"missing-account","runtime":"worker","provider":"cloudflare"}\n' > "$tmp/bot-factory.json"

          if node scripts/read-manifest.mjs "$tmp" owner/repo >/tmp/manifest-output.txt 2>&1; then
            echo "::error::Manifest without cloudflare_account was unexpectedly accepted."
            exit 1
          fi

      - name: Test Cloudflare account registry
        run: |
          set -euo pipefail
          registry='{"guild-a":{"account_id":"0123456789abcdef0123456789abcdef","token_secret":"CLOUDFLARE_GUILD_A_API_TOKEN"}}'
          output="$(
            CLOUDFLARE_ACCOUNTS_JSON="$registry"               node scripts/cloudflare/resolve-account.mjs guild-a
          )"

          printf '%s\n' "$output" | grep -F '0123456789abcdef0123456789abcdef'
          printf '%s\n' "$output" | grep -F 'CLOUDFLARE_GUILD_A_API_TOKEN'

      - name: Enforce Cloudflare-only scope
        run: |
          set -euo pipefail

          test -f .github/workflows/deploy-bot.yml
          test -f scripts/cloudflare/deploy.sh
          test -f scripts/cloudflare/resolve-account.mjs

          test ! -e scripts/oracle
          test ! -e .github/workflows/create-bot-repository.yml
          test ! -e scripts/create-repository.sh
          test ! -e scripts/scaffold-repository.sh
          test ! -e templates

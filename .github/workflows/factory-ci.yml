name: Factory CI

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Check shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' file; do
              bash -n "$file"
            done

      - name: Test Worker manifest
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          mkdir -p "$tmp/apps/worker"
          cat > "$tmp/bot-factory.json" <<'JSON'
          {
            "name": "Test Worker",
            "runtime": "worker",
            "provider": "cloudflare",
            "working_directory": "apps/worker",
            "wrangler_config": "wrangler.jsonc",
            "d1_migrations": ["DB"]
          }
          JSON
          printf '{}\n' > "$tmp/apps/worker/wrangler.jsonc"

          output="$(node scripts/read-manifest.mjs "$tmp" owner/repo)"
          printf '%s\n' "$output" | grep -F 'test-worker'
          printf '%s\n' "$output" | grep -F 'cloudflare'
          printf '%s\n' "$output" | grep -F 'apps/worker'

      - name: Test Node auto-detection
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '{"scripts":{"start":"node src/index.js"}}\n' > "$tmp/package.json"

          output="$(node scripts/read-manifest.mjs "$tmp" owner/Discord-Ticket)"
          printf '%s\n' "$output" | grep -F 'discord-ticket'
          printf '%s\n' "$output" | grep -F 'oracle'
          printf '%s\n' "$output" | grep -F 'node'

      - name: Enforce deployment-only scope
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-bot.yml
          test -f scripts/cloudflare/deploy.sh
          test -f scripts/oracle/ensure-host.sh
          test -f scripts/oracle/deploy.sh

          test ! -e .github/workflows/create-bot-repository.yml
          test ! -e scripts/create-repository.sh
          test ! -e scripts/scaffold-repository.sh
          test ! -e templates

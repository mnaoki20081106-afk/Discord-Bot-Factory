name: Hotfix Xaccount member activity

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hotfix-xaccount-member-activity.yml"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      CONTROL_CF_TOKEN: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_API_TOKEN }}
      CONTROL_CF_ACCOUNT_ID: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_MASTER_KEY: ${{ secrets.CONTROL_PLANE_MASTER_KEY }}
      CONTROL_D1_ID: "a58cdc1b-6f07-4d90-bdd0-2bbd16d0f7e6"
      XACCOUNT_CF_ACCOUNT_ID: "3f4daf94bed8e8159413918292375b7a"
      XACCOUNT_D1_ID: "284a6d6b-0dc5-479f-ba0e-86eb445df2cd"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover Xaccount Cloudflare credential securely
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { webcrypto } = require("node:crypto");
          const fs = require("node:fs");
          const crypto = webcrypto;

          (async () => {
            const cpToken = process.env.CONTROL_CF_TOKEN;
            const cpAccount = process.env.CONTROL_CF_ACCOUNT_ID;
            const cpDb = process.env.CONTROL_D1_ID;
            const masterB64 = process.env.CONTROL_MASTER_KEY;
            const targetAccount = process.env.XACCOUNT_CF_ACCOUNT_ID;

            const response = await fetch(
              "https://api.cloudflare.com/client/v4/accounts/" +
                cpAccount + "/d1/database/" + cpDb + "/query",
              {
                method: "POST",
                headers: {
                  Authorization: "Bearer " + cpToken,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  sql: "SELECT encrypted_token FROM cloudflare_accounts WHERE account_id=? LIMIT 1",
                  params: [targetAccount]
                })
              }
            );
            const body = await response.json();
            const row = body?.result?.[0]?.results?.[0];
            if (!response.ok || body.success === false || !row?.encrypted_token) {
              throw new Error("Xaccount Cloudflare credential lookup failed");
            }

            const packed = JSON.parse(row.encrypted_token);
            const rawKey = Buffer.from(String(masterB64).replace(/\s+/g, ""), "base64");
            if (packed.v !== 1 || rawKey.length !== 32) {
              throw new Error("Stored credential format mismatch");
            }
            const key = await crypto.subtle.importKey(
              "raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]
            );
            const tokenBytes = await crypto.subtle.decrypt(
              {
                name: "AES-GCM",
                iv: Uint8Array.from(Buffer.from(packed.iv, "base64"))
              },
              key,
              Uint8Array.from(Buffer.from(packed.ct, "base64"))
            );
            const token = Buffer.from(tokenBytes).toString("utf8");
            if (!token) throw new Error("Decrypted Xaccount token is empty");

            process.stdout.write("::add-mask::" + token + "\n");
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              "CLOUDFLARE_API_TOKEN=" + token + "\n" +
              "CLOUDFLARE_ACCOUNT_ID=" + targetAccount + "\n"
            );
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Checkout current Xaccount main
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            https://github.com/mnaoki20081106-afk/Xaccount-Bot.git source
          echo "Deploying Xaccount commit: $(git -C source rev-parse HEAD)"

      - name: Install Xaccount dependencies
        working-directory: source
        run: npm ci

      - name: Deploy Xaccount Worker hotfix
        working-directory: source/apps/worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.142.0 deploy \
            --config wrangler.jsonc \
            --name xaccount-bot

      - name: Verify live member Gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            health="$(curl -fsS --retry 2 --retry-delay 1 \
              https://xaccount-bot.mnaoki20081106.workers.dev/health)"
            echo "$health"
            if node -e '
              const h=JSON.parse(process.argv[1]);
              process.exit(
                h.version==="member-activity-isolated-v2" &&
                h.memberActivityRecovery==="dedicated-gateway-plus-do-reconcile" &&
                h.memberGateway?.connected===true
                  ? 0 : 1
              );
            ' "$health"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Member Gateway did not become connected."
          exit 1

      - name: Verify production member sweep advances
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.XACCOUNT_CF_ACCOUNT_ID;
            const db = process.env.XACCOUNT_D1_ID;

            async function readState() {
              const response = await fetch(
                "https://api.cloudflare.com/client/v4/accounts/" +
                  account + "/d1/database/" + db + "/query",
                {
                  method: "POST",
                  headers: {
                    Authorization: "Bearer " + token,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    sql: `SELECT MAX(last_scan_at) AS last_scan_at,
                                 MAX(updated_at) AS updated_at,
                                 MAX(last_error) AS last_error
                            FROM member_activity_settings
                           WHERE enabled=1`
                  })
                }
              );
              const body = await response.json();
              if (!response.ok || body.success === false) {
                throw new Error("Production D1 verification query failed");
              }
              return body?.result?.[0]?.results?.[0] || {};
            }

            for (let attempt = 1; attempt <= 25; attempt += 1) {
              const state = await readState();
              const lastScan = Number(state.last_scan_at || 0);
              const fresh = lastScan > 0 && Date.now() - lastScan < 120_000;
              const result = {
                fresh,
                lastScanAt: lastScan ? new Date(lastScan).toISOString() : null,
                lastError: state.last_error || null
              };
              console.log("MEMBER_SWEEP_VERIFY=" + JSON.stringify(result));
              if (fresh && !state.last_error) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }

            throw new Error("Production member sweep did not advance cleanly");
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

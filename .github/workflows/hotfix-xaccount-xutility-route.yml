name: Hotfix Xaccount XUtility route

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hotfix-xaccount-xutility-route.yml"

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      CONTROL_CF_TOKEN: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_API_TOKEN }}
      CONTROL_CF_ACCOUNT_ID: ${{ secrets.CONTROL_PLANE_CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_MASTER_KEY: ${{ secrets.CONTROL_PLANE_MASTER_KEY }}
      CONTROL_D1_ID: "a58cdc1b-6f07-4d90-bdd0-2bbd16d0f7e6"
      XACCOUNT_CF_ACCOUNT_ID: "3f4daf94bed8e8159413918292375b7a"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover Xaccount Cloudflare credential securely
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { webcrypto } = require("node:crypto");
          const fs = require("node:fs");
          const crypto = webcrypto;
          (async () => {
            const response = await fetch(
              "https://api.cloudflare.com/client/v4/accounts/" +
                process.env.CONTROL_CF_ACCOUNT_ID +
                "/d1/database/" + process.env.CONTROL_D1_ID + "/query",
              {
                method: "POST",
                headers: {
                  Authorization: "Bearer " + process.env.CONTROL_CF_TOKEN,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  sql: "SELECT encrypted_token FROM cloudflare_accounts WHERE account_id=? LIMIT 1",
                  params: [process.env.XACCOUNT_CF_ACCOUNT_ID]
                })
              }
            );
            const body = await response.json();
            const row = body?.result?.[0]?.results?.[0];
            if (!response.ok || body.success === false || !row?.encrypted_token) {
              throw new Error("Xaccount Cloudflare credential lookup failed");
            }
            const packed = JSON.parse(row.encrypted_token);
            const rawKey = Buffer.from(String(process.env.CONTROL_MASTER_KEY).replace(/\s+/g, ""), "base64");
            const key = await crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]);
            const tokenBytes = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: Uint8Array.from(Buffer.from(packed.iv, "base64")) },
              key,
              Uint8Array.from(Buffer.from(packed.ct, "base64"))
            );
            const token = Buffer.from(tokenBytes).toString("utf8");
            process.stdout.write("::add-mask::" + token + "\n");
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              "CLOUDFLARE_API_TOKEN=" + token + "\n" +
              "CLOUDFLARE_ACCOUNT_ID=" + process.env.XACCOUNT_CF_ACCOUNT_ID + "\n"
            );
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Checkout current Xaccount main
        run: |
          git clone --depth 1 --branch main https://github.com/mnaoki20081106-afk/Xaccount-Bot.git source
          echo "Deploying Xaccount commit: $(git -C source rev-parse HEAD)"

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Deploy Worker
        working-directory: source/apps/worker
        run: npx --yes wrangler@4.142.0 deploy --config wrangler.jsonc --name xaccount-bot

      - name: Verify XUtility credential route exists
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/route-body.txt -w "%{http_code}"             https://xaccount-bot.mnaoki20081106.workers.dev/api/guilds/1/xutility/search-credential)"
          cat /tmp/route-body.txt
          test "$code" = "401"
